<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LintMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal styles */
        .register {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Black background with opacity */
            justify-content: center;
            align-items: center;
        }

        .registerContent {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .register-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        form label {
            display: block;
            margin-bottom: 8px;
        }

        form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #loginBtn, #regBtn {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
        }
    </style>
</head>
<body>
    <nav>
        <img src="LintMaster logo.png" alt="logo">
        <a href="/">Home</a>
        <a href="/#syntax-checker">Syntax Checker</a>
        <a href="/snippet">Snippet Manager</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact Us</a>
        <button id="logBtn" style="margin-right: 15vh;">Login</button>
        <button id="registerBtn">Register</button>
    </nav>

    <!-- Modal -->
    <div class="register" id="registerForm">
        <div class="registerContent">
            <span class="register-btn" id="closeForm">&times;</span>
            <form action="/register" method="post">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>

                <label for="password2">Confirm Password</label>
                <input type="password" name="password2" id="password2" required>

                <button id="regBtn" type="submit">Register</button>
            </form>
        </div>
    </div>

    <script>
        // JavaScript to handle modal display
        const modal = document.getElementById("registerForm");
        const registerBtn = document.getElementById("registerBtn");
        const closeModal = document.getElementById("closeForm");

        // Show modal when Register button is clicked
        registerBtn.onclick = function() {
            modal.style.display = "flex";
        };

        // Close modal when 'X' is clicked
        closeModal.onclick = function() {
            modal.style.display = "none";
        };

        // Close modal if user clicks outside the modal content
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>
</body>
</html>
